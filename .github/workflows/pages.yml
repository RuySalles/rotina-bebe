name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar testes de regras
        run: node tests/rodar.mjs

      - name: Gerar config.js a partir do segredo
        env:
          WEBAPP_URL: ${{ secrets.ROTINA_WEBAPP_URL }}
        run: |
          node -e "require('fs').writeFileSync('config.js', 'export const CONFIG = { webAppUrl: ' + JSON.stringify(process.env.WEBAPP_URL || '') + ' };\n')"

      - name: Montar site (com pasta por versão, para a atualização automática)
        run: bash scripts/montar-site.sh "$(echo "$GITHUB_SHA" | cut -c1-8)" _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
