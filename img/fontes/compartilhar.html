<!doctype html>
<!--
  Fonte da imagem de compartilhamento (img/compartilhar.png, 1200x630).
  Para gerar de novo (Windows), na pasta do projeto:
  "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars
    --window-size=1200,630 --screenshot="%CD%\img\compartilhar.png" "%CD%\img\fontes\compartilhar.html"
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #2a2521;
    background:
      radial-gradient(700px 520px at 92% 8%, rgba(63, 143, 138, 0.20), transparent 70%),
      radial-gradient(520px 420px at 4% 100%, rgba(208, 138, 78, 0.16), transparent 70%),
      #f6f2ec;
    display: flex;
    align-items: center;
    padding: 0 84px;
    gap: 64px;
  }
  .texto { flex: 1; }
  .marca {
    width: 96px; height: 96px; border-radius: 30px;
    background: #2f6f6a; display: grid; place-items: center; margin-bottom: 38px;
    box-shadow: 0 14px 30px rgba(47, 111, 106, 0.28);
  }
  .marca svg { width: 56px; height: 56px; }
  h1 {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 86px; font-weight: 600; letter-spacing: -1.5px; line-height: 1;
  }
  p { margin-top: 24px; font-size: 31px; line-height: 1.35; color: #6e655c; max-width: 560px; }
  .icones { display: flex; gap: 14px; margin-top: 40px; }
  .ic {
    width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 16%, #fff); color: var(--c);
  }
  .ic svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .cartao {
    width: 400px; padding: 30px; border-radius: 34px; background: #fff;
    box-shadow: 0 2px 4px rgba(42, 37, 33, 0.05), 0 30px 60px rgba(42, 37, 33, 0.12);
    border: 1px solid rgba(208, 138, 78, 0.25);
    transform: rotate(2deg);
  }
  .topo { display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; }
  .rot { color: #d08a4e; letter-spacing: 3px; }
  .conta { color: #6e655c; }
  .corpo { display: flex; align-items: center; gap: 18px; margin: 26px 0 28px; }
  .corpo .ic { --c: #d08a4e; width: 70px; height: 70px; }
  .titulo { font-size: 27px; font-weight: 700; }
  .det { font-size: 19px; color: #6e655c; }
  .hora { margin-left: auto; font-size: 46px; font-weight: 700; letter-spacing: -1px; }
  .botao { height: 64px; border-radius: 20px; background: #d08a4e; color: #fff; display: grid; place-items: center; font-size: 21px; font-weight: 700; }
</style>
</head>
<body>
  <div class="texto">
    <div class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f6f2ec" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/><path d="M16.5 3.5v3M15 5h3"/></svg>
    </div>
    <h1>Rotina do bebê</h1>
    <p>Remédios, alimentação e febre, no celular de quem cuida.</p>
    <div class="icones">
      <span class="ic" style="--c:#3F8F8A"><svg viewBox="0 0 24 24"><path d="M10.6 3.9a5 5 0 0 1 7.1 7.1l-6.7 6.7a5 5 0 0 1-7.1-7.1z"/><path d="M7.3 7.3l7.1 7.1"/></svg></span>
      <span class="ic" style="--c:#8070C4"><svg viewBox="0 0 24 24"><path d="M12 3.2c3.6 4.3 6 7.4 6 10.6a6 6 0 0 1-12 0c0-3.2 2.4-6.3 6-10.6z"/><path d="M9.4 14.2a2.6 2.6 0 0 0 2.6 2.6"/></svg></span>
      <span class="ic" style="--c:#D08A4E"><svg viewBox="0 0 24 24"><path d="M9.5 2.5h5"/><path d="M10.5 2.5v2.8L8.3 8.4v10.3A2.8 2.8 0 0 0 11.1 21.5h1.8a2.8 2.8 0 0 0 2.8-2.8V8.4l-2.2-3.1V2.5"/><path d="M8.3 12.5h7.4"/></svg></span>
      <span class="ic" style="--c:#D2614F"><svg viewBox="0 0 24 24"><path d="M14 14.6V5a2 2 0 0 0-4 0v9.6a4 4 0 1 0 4 0z"/><path d="M12 9v6.5"/></svg></span>
    </div>
  </div>

  <div class="cartao">
    <div class="topo"><span class="rot">PRÓXIMO</span><span class="conta">em 1h 20min</span></div>
    <div class="corpo">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M9.5 2.5h5"/><path d="M10.5 2.5v2.8L8.3 8.4v10.3A2.8 2.8 0 0 0 11.1 21.5h1.8a2.8 2.8 0 0 0 2.8-2.8V8.4l-2.2-3.1V2.5"/><path d="M8.3 12.5h7.4"/></svg></span>
      <div><div class="titulo">Alimentação</div><div class="det">3h após a última</div></div>
      <div class="hora">15:25</div>
    </div>
    <div class="botao">Registrar alimentação</div>
  </div>
</body>
</html>
